<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 ThreeJSEvolution - AI Enemy Demo</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 300px;
        }
        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #ff8800; }
        .key { color: #00ff00; font-weight: bold; }
        .enemy-info { margin-top: 10px; padding-top: 10px; border-top: 1px solid #444; }
        .health-bar { color: #ff4444; }
    </style>
</head>
<body>
    <div id="info">
        <h1>🎮 AI Enemy System Demo</h1>
        <p><span class="key">WASD</span> - 移动玩家</p>
        <p><span class="key">空格</span> - 攻击</p>
        <p><span class="key">1</span> - 生成近战敌人</p>
        <p><span class="key">2</span> - 生成远程敌人</p>
        <p><span class="key">3</span> - 生成BOSS</p>
        <p><span class="key">4</span> - 生成整波敌人</p>
        <div class="enemy-info">
            <p>🐺 近战敌人: 橙色</p>
            <p>🏹 远程敌人: 红色</p>
            <p>👹 BOSS: 紫色</p>
        </div>
    </div>
    
    <div id="stats">
        <p>玩家: <span id="playerHP">100</span> HP</p>
        <p>敌人数量: <span id="enemyCount">0</span></p>
        <p>状态: <span id="aiState">-</span></p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Enemy, EnemySpawner } from './src/AI/Enemy.js';

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 20, 80);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add(directionalLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x2d4a3e,
            roughness: 0.8 
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid
        const grid = new THREE.GridHelper(100, 50, 0x444444, 0x333333);
        scene.add(grid);

        // Player (简化的玩家)
        const player = {
            position: new THREE.Vector3(0, 1, 0),
            health: 100,
            takeDamage: function(amount) {
                this.health = Math.max(0, this.health - amount);
                document.getElementById('playerHP').textContent = this.health;
                
                // 受伤视觉效果
                scene.background = new THREE.Color(0x440000);
                setTimeout(() => {
                    scene.background = new THREE.Color(0x1a1a2e);
                }, 100);
            }
        };

        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 2, 1),
            new THREE.MeshPhongMaterial({ color: 0x00ff88 })
        );
        playerMesh.position.copy(player.position);
        playerMesh.castShadow = true;
        scene.add(playerMesh);

        // Player indicator (arrow)
        const playerIndicator = new THREE.Mesh(
            new THREE.ConeGeometry(0.3, 0.5, 4),
            new THREE.MeshBasicMaterial({ color: 0x00ff88 })
        );
        playerIndicator.rotation.x = Math.PI / 2;
        playerIndicator.position.y = 3;
        scene.add(playerIndicator);

        // Enemy Spawner
        const spawner = new EnemySpawner(scene);
        
        // 添加生成点
        for (let x = -20; x <= 20; x += 10) {
            for (let z = -20; z <= 20; z += 10) {
                if (x !== 0 || z !== 0) {
                    spawner.addSpawnPoint(x, 1, z);
                }
            }
        }

        // Projectiles array
        const projectiles = [];
        
        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === '1') spawner.spawnEnemy('melee');
            if (e.key === '2') spawner.spawnEnemy('ranged');
            if (e.key === '3') spawner.spawnEnemy('boss');
            if (e.key === '4') spawner.spawnWave({ melee: 3, ranged: 2, boss: false });
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Animation
        const clock = new THREE.Clock();
        let enemyUpdateTimer = 0;

        function createProjectile(proj) {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 8, 8),
                new THREE.MeshBasicMaterial({ color: proj.color })
            );
            mesh.position.copy(proj.position);
            scene.add(mesh);
            
            return { mesh, ...proj };
        }

        function updateProjectiles(deltaTime) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.life -= deltaTime;
                
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                    continue;
                }
                
                // 移动
                p.position.add(p.direction.clone().multiplyScalar(p.speed * deltaTime));
                p.mesh.position.copy(p.position);
                
                // 检测与玩家碰撞
                if (p.position.distanceTo(player.position) < 1.5) {
                    player.takeDamage(p.damage);
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min(clock.getDelta(), 0.1);
            
            // Player movement
            const moveSpeed = 8;
            const moveDir = new THREE.Vector3();
            
            if (keys['w']) moveDir.z -= 1;
            if (keys['s']) moveDir.z += 1;
            if (keys['a']) moveDir.x -= 1;
            if (keys['d']) moveDir.x += 1;
            
            if (moveDir.length() > 0) {
                moveDir.normalize().multiplyScalar(moveSpeed * deltaTime);
                player.position.add(moveDir);
                playerMesh.position.copy(player.position);
            }
            
            // Player indicator follows
            playerIndicator.position.x = player.position.x;
            playerIndicator.position.z = player.position.z;
            playerIndicator.rotation.z += deltaTime * 2;

            // Update enemies
            enemyUpdateTimer += deltaTime;
            if (enemyUpdateTimer >= 0.016) {
                const gameState = {
                    player: player,
                    projectiles: projectiles
                };
                
                spawner.enemies.forEach(enemy => {
                    enemy.setTarget(player);
                });
                
                spawner.update(0.016, gameState);
                enemyUpdateTimer = 0;
            }
            
            // Update projectiles
            updateProjectiles(deltaTime);
            
            // Update UI
            document.getElementById('enemyCount').textContent = spawner.enemies.length;
            
            if (spawner.enemies.length > 0) {
                const nearestEnemy = spawner.enemies.reduce((nearest, enemy) => {
                    const dist = enemy.position.distanceTo(player.position);
                    return dist < nearest.dist ? { enemy, dist } : nearest;
                }, { enemy: null, dist: Infinity });
                
                document.getElementById('aiState').textContent = 
                    nearestEnemy.enemy ? nearestEnemy.enemy.state : '-';
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initial enemies
        spawner.spawnWave({ melee: 2, ranged: 1, boss: false });

        animate();
        
        console.log('🎮 ThreeJSEvolution AI Enemy Demo loaded!');
    </script>
</body>
</html>
