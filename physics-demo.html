<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 物理引擎 + 粒子系统演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 12px;
            color: white;
            z-index: 100;
            min-width: 220px;
        }
        #controls h3 {
            margin-bottom: 15px;
            color: #00ff88;
            font-size: 16px;
        }
        #controls button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #controls button:hover {
            transform: scale(1.05);
        }
        #controls button:active {
            transform: scale(0.95);
        }
        #controls button.secondary {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
        }
        #stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            z-index: 100;
        }
        #stats .label {
            color: #888;
        }
        #stats .value {
            color: #00ff88;
            font-weight: bold;
        }
       -container {
            margin: 15px 0;
        }
        . .sliderslider-container label {
            display: block;
            margin-bottom: 5: #ccc;
px;
            color            font-size: 12px;
        }
        .slider-container input {
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h3>🎮 物理引擎控制台</h3>
        
        <button onclick="spawnBox()">📦 生成方块</button>
        <button onclick="spawnSphere()">⚽ 生成球体</button>
        <button onclick="spawnExplosion()">💥 爆炸特效</button>
        <button onclick="spawnFirework()">🎆 烟花特效</button>
        <button onclick="toggleGravity()">🌍 切换重力</button>
        <button class="secondary" onclick="resetScene()">🔄 重置场景</button>
        
        <div class="slider-container">
            <label>重力强度: <span id="gravityValue">-10</span></label>
            <input type="range" id="gravitySlider" min="-20" max="0" value="-10" step="1">
        </div>
        
        <div class="slider-container">
            <label>粒子数量: <span id="particleValue">100</span></label>
            <input type="range" id="particleSlider" min="50" max="500" value="100" step="10">
        </div>
    </div>
    
    <div id="stats">
        <div><span class="label">物体数量:</span> <span class="value" id="bodyCount">0</span></div>
        <div><span class="label">粒子数量:</span> <span class="value" id="particleCount">0</span></div>
        <div><span class="label">FPS:</span> <span class="value" id="fps">60</span></div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Cannon.js Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    
    <script>
        // ==================== Three.js Setup ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);
        
        // ==================== Lights ====================
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        scene.add(directionalLight);
        
        // Colorful point lights
        const pointLight1 = new THREE.PointLight(0xff0066, 0.5, 30);
        pointLight1.position.set(-10, 5, -10);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0x00ff88, 0.5, 30);
        pointLight2.position.set(10, 5, 10);
        scene.add(pointLight2);
        
        // ==================== Cannon.js Physics ====================
        const world = new CANNON.World();
        world.gravity.set(0, -10, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;
        
        // Physics materials
        const groundMaterial = new CANNON.Material('ground');
        const boxMaterial = new CANNON.Material('box');
        const boxGroundContact = new CANNON.ContactMaterial(groundMaterial, boxMaterial, {
            friction: 0.5,
            restitution: 0.3
        });
        world.addContactMaterial(boxGroundContact);
        
        // ==================== Ground ====================
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x2d2d44,
            roughness: 0.8,
            metalness: 0.2
        });
        const groundMesh = new THREE.Mesh(groundGeometry, groundMat);
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);
        
        const groundShape = new CANNON.Plane();
        const groundBody = new CANNON.Body({ mass: 0, material: groundMaterial });
        groundBody.addShape(groundShape);
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);
        
        // Grid helper
        const gridHelper = new THREE.GridHelper(50, 50, 0x00ff88, 0x333355);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);
        
        // ==================== Objects ====================
        const objects = [];
        const bodies = [];
        
        function createBox(x, y, z) {
            const size = 1 + Math.random();
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshStandardMaterial({
                color: Math.random() * 0xffffff,
                roughness: 0.4,
                metalness: 0.3
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            
            const shape = new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2));
            const body = new CANNON.Body({ 
                mass: 1, 
                material: boxMaterial,
                linearDamping: 0.1,
                angularDamping: 0.1
            });
            body.addShape(shape);
            body.position.set(x, y, z);
            body.velocity.set(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5
            );
            body.angularVelocity.set(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5
            );
            world.addBody(body);
            
            objects.push(mesh);
            bodies.push(body);
            return body;
        }
        
        function createSphere(x, y, z) {
            const radius = 0.5 + Math.random() * 0.5;
            const geometry = new THREE.SphereGeometry(radius, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: Math.random() * 0xffffff,
                roughness: 0.2,
                metalness: 0.5
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            
            const shape = new CANNON.Sphere(radius);
            const body = new CANNON.Body({ 
                mass: 0.5, 
                material: boxMaterial,
                linearDamping: 0.1,
                angularDamping: 0.1
            });
            body.addShape(shape);
            body.position.set(x, y, z);
            body.velocity.set(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5
            );
            world.addBody(body);
            
            objects.push(mesh);
            bodies.push(body);
            return body;
        }
        
        // ==================== Particle System ====================
        const particles = [];
        const particleGeometry = new THREE.SphereGeometry(0.1, 8, 8);
        
        class Particle {
            constructor(x, y, z, color, velocity, life = 1.0, decay = 0.02) {
                this.geometry = particleGeometry;
                this.material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1
                });
                this.mesh = new THREE.Mesh(this.geometry, this.material);
                this.mesh.position.set(x, y, z);
                scene.add(this.mesh);
                
                this.velocity = velocity;
                this.life = life;
                this.decay = decay;
                this.gravity = -0.1;
            }
            
            update() {
                this.velocity.y += this.gravity;
                this.mesh.position.add(this.velocity);
                this.life -= this.decay;
                this.material.opacity = this.life;
                return this.life > 0;
            }
            
            dispose() {
                scene.remove(this.mesh);
                this.material.dispose();
            }
        }
        
        function createExplosion(x, y, z) {
            const count = parseInt(document.getElementById('particleSlider').value);
            const colors = [0xff6b6b, 0xff8e53, 0xffd93d, 0xff0066, 0x00ff88];
            
            for (let i = 0; i < count; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 15,
                    Math.random() * 10 + 5,
                    (Math.random() - 0.5) * 15
                );
                const particle = new Particle(x, y, z, color, velocity, 1.0, 0.015);
                particles.push(particle);
            }
        }
        
        function createFirework(x, y, z) {
            const colors = [0xff0066, 0x00ff88, 0x00ccff, 0xffd93d, 0xff8e53, 0x9b59b6];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = 50;
            
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const speed = 5 + Math.random() * 3;
                const velocity = new THREE.Vector3(
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    (Math.random() - 0.5) * 2
                );
                const particle = new Particle(x, y, z, color, velocity, 1.0, 0.02);
                particles.push(particle);
            }
        }
        
        // ==================== Control Functions ====================
        function spawnBox() {
            createBox(
                (Math.random() - 0.5) * 10,
                15,
                (Math.random() - 0.5) * 10
            );
        }
        
        function spawnSphere() {
            createSphere(
                (Math.random() - 0.5) * 10,
                15,
                (Math.random() - 0.5) * 10
            );
        }
        
        function spawnExplosion() {
            createExplosion(
                (Math.random() - 0.5) * 10,
                5,
                (Math.random() - 0.5) * 10
            );
        }
        
        function spawnFirework() {
            createFirework(
                (Math.random() - 0.5) * 10,
                15,
                (Math.random() - 0.5) * 10
            );
        }
        
        let gravityEnabled = true;
        function toggleGravity() {
            gravityEnabled = !gravityEnabled;
            world.gravity.set(0, gravityEnabled ? -10 : 0, 0);
        }
        
        function resetScene() {
            // Remove all objects
            for (let i = 0; i < objects.length; i++) {
                scene.remove(objects[i]);
                world.removeBody(bodies[i]);
            }
            objects.length = 0;
            bodies.length = 0;
            
            // Remove all particles
            for (const particle of particles) {
                particle.dispose();
            }
            particles.length = 0;
        }
        
        // ==================== UI Event Listeners ====================
        document.getElementById('gravitySlider').addEventListener('input', (e) => {
            const g = parseFloat(e.target.value);
            document.getElementById('gravityValue').textContent = g;
            world.gravity.set(0, g, 0);
        });
        
        document.getElementById('particleSlider').addEventListener('input', (e) => {
            document.getElementById('particleValue').textContent = e.target.value;
        });
        
        // ==================== Mouse Interaction ====================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        document.addEventListener('click', (event) => {
            if (event.target.tagName === 'BUTTON') return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(groundMesh);
            
            if (intersects.length > 0) {
                const point = intersects[0].point;
                if (Math.random() > 0.5) {
                    createBox(point.x, 10, point.z);
                } else {
                    createSphere(point.x, 10, point.z);
                }
            }
        });
        
        // ==================== Animation Loop ====================
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;
        
        function animate() {
            requestAnimationFrame(animate);
            
            const currentTime = performance.now();
            frameCount++;
            
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                document.getElementById('fps').textContent = fps;
            }
            
            // Step physics
            world.step(1/60);
            
            // Sync Three.js meshes with Cannon.js bodies
            for (let i = 0; i < objects.length; i++) {
                objects[i].position.copy(bodies[i].position);
                objects[i].quaternion.copy(bodies[i].quaternion);
            }
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const alive = particles[i].update();
                if (!alive) {
                    particles[i].dispose();
                    particles.splice(i, 1);
                }
            }
            
            // Update stats
            document.getElementById('bodyCount').textContent = objects.length;
            document.getElementById('particleCount').textContent = particles.length;
            
            // Animate lights
            const time = Date.now() * 0.001;
            pointLight1.position.x = Math.sin(time) * 10;
            pointLight1.position.z = Math.cos(time) * 10;
            pointLight2.position.x = Math.cos(time * 0.7) * 10;
            pointLight2.position.z = Math.sin(time * 0.7) * 10;
            
            // Rotate camera slightly
            camera.position.x = Math.sin(time * 0.1) * 20;
            camera.position.z = Math.cos(time * 0.1) * 20;
            camera.lookAt(0, 3, 0);
            
            renderer.render(scene, camera);
        }
        
        // ==================== Handle Resize ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start
        animate();
        
        // Spawn initial objects
        for (let i = 0; i < 5; i++) {
            createBox((Math.random() - 0.5) * 10, 10 + i * 3, (Math.random() - 0.5) * 10);
        }
    </script>
</body>
</html>
